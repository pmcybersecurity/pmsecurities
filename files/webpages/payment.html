<html>
    <style>
        body { background-color: #0B111E; color: #E2E8F0; scroll-behavior: smooth; }
        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),

<style id="knowledge-search-styles">
.kb-search-wrapper {
    max-width: 680px;
    margin: 0 auto 55px;
    position: relative;
    z-index: 20;
}

.kb-search-box {
    position: relative;
    display: flex;
    align-items: center;
    height: 48px;
    background: rgba(18, 26, 46, 0.88);
    border: 1px solid rgba(71, 85, 105, 0.7);
    border-radius: 999px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(14px);
    transition: all 0.3s ease;
}

.kb-search-box:focus-within {
    border-color: rgba(0, 240, 255, 0.7);
    box-shadow:
        0 0 0 3px rgba(0, 240, 255, 0.07),
        0 12px 45px rgba(0, 240, 255, 0.08);
    transform: translateY(-1px);
}

.kb-search-icon {
    color: #00F0FF;
    font-size: 22px;
    margin-left: 18px;
    margin-right: 10px;
    line-height: 1;
}

#kb-search {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #E2E8F0;
    font-size: 13px;
    padding-right: 45px;
}

#kb-search::placeholder {
    color: #64748B;
}

#kb-search-clear {
    position: absolute;
    right: 17px;
    color: #64748B;
    font-size: 19px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
}

#kb-search-clear.active {
    opacity: 1;
    pointer-events: auto;
}

#kb-search-clear:hover {
    color: #FF4A5A;
}

.kb-search-results {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    max-height: 390px;
    overflow-y: auto;
    background: rgba(11, 17, 30, 0.97);
    border: 1px solid rgba(51, 65, 85, 0.9);
    border-radius: 18px;
    padding: 8px;
    backdrop-filter: blur(18px);
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(0, 240, 255, 0.04);
}

.kb-search-results::-webkit-scrollbar {
    width: 5px;
}

.kb-search-results::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 999px;
}

.kb-result-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 14px 16px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    transition: all 0.25s ease;
    animation: kbResultIn 0.25s ease both;
}

.kb-result-card:hover {
    background: rgba(18, 26, 46, 0.9);
    border-color: rgba(0, 240, 255, 0.22);
    transform: translateX(3px);
}

.kb-result-info {
    min-width: 0;
}

.kb-result-title {
    color: #F8FAFC;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.kb-result-category {
    margin-top: 4px;
    color: #64748B;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

.kb-result-arrow {
    flex-shrink: 0;
    color: #00F0FF;
    font-size: 12px;
    font-weight: 700;
}

.kb-no-results {
    padding: 28px 18px;
    text-align: center;
    color: #64748B;
    font-size: 12px;
}

.kb-no-results strong {
    display: block;
    color: #CBD5E1;
    margin-bottom: 5px;
}

@keyframes kbResultIn {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 640px) {
    .kb-search-wrapper {
        margin-bottom: 40px;
    }

    .kb-search-box {
        height: 46px;
    }

    .kb-search-results {
        max-height: 320px;
    }

    .kb-result-card {
        padding: 13px;
    }
}
</style>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Security | Course Payment</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b111e;
      --panel: rgba(17, 27, 44, 0.85);
      --border: #26354b;
      --cyan: #00f0ff;
      --text: #e8f0fc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #142840 0, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 540px;
      padding: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 70px #0005;
    }

    .brand {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 34px);
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 20px 0 9px;
      font-size: 13px;
      font-weight: 700;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      background: #0b1422;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--cyan);
    }

    option {
      background: #0b1422;
    }

    .course-info {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #0b1422;
    }

    .course-info h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    .course-info p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      background: var(--cyan);
      color: #06111b;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #0b1422;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">PM SECURITY</div>

    <h1>Course Registration</h1>

    <p class="subtitle">
      Select your cybersecurity course and submit your registration details.
    </p>

    <form id="paymentForm">
      <label for="courseSelect">Select a course</label>

      <select id="courseSelect" required>
        <option value="">Loading courses...</option>
      </select>

      <section id="courseInfo" class="course-info hidden">
        <h2 id="courseTitle"></h2>
        <p id="courseType"></p>
        <p id="courseDescription" style="margin-top: 8px;"></p>
      </section>

      <label for="studentName">Full name</label>
      <input
        id="studentName"
        type="text"
        placeholder="Enter your full name"
        autocomplete="name"
        required
      >

      <label for="studentEmail">Email address</label>
      <input
        id="studentEmail"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="paymentReference">Payment reference (if already paid)</label>
      <input
        id="paymentReference"
        type="text"
        placeholder="Transaction ID or UTR"
      >

      <button id="submitButton" class="button" type="submit" disabled>
        Submit Registration
      </button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite">
      Connecting to the course database...
    </div>

    <div class="footer">
      PM Security · Cybersecurity Education
    </div>
  </main>

  <script>
    // Your Supabase project configuration
    const SUPABASE_URL =
      "https://dxabaafoboaoawwmignq.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4YWJhYWZvYm9hb2F3d21pZ25xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMjY1MzgsImV4cCI6MjA5NTgwMjUzOH0.pBazFISQbM1srXh5GSSf2GUu7Kz0qhYgl_eB67RvJUc"
      
    const _supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const courseSelect = document.getElementById("courseSelect");
    const courseInfo = document.getElementById("courseInfo");
    const courseTitle = document.getElementById("courseTitle");
    const courseType = document.getElementById("courseType");
    const courseDescription = document.getElementById("courseDescription");
    const paymentForm = document.getElementById("paymentForm");
    const submitButton = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");

    let courses = [];

    function setStatus(message) {
      statusBox.textContent = message;
    }

    // Fetch courses from Supabase
    async function fetchCoursesFromDatabase() {
      courseSelect.innerHTML =
        '<option value="">Loading courses...</option>';

      submitButton.disabled = true;

      const { data, error } = await _supabase
        .from("courses")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Course fetch error:", error);

        courseSelect.innerHTML =
          '<option value="">Unable to load courses</option>';

        setStatus(
          "Could not load courses. Check your Supabase table, permissions, and internet connection."
        );

        return;
      }

      courses = data || [];

      courseSelect.innerHTML =
        '<option value="">Choose a course</option>';

      courses.forEach((course, index) => {
        const option = document.createElement("option");

        // Use the row ID where available; otherwise use its array index.
        option.value = course.id ?? String(index);
        option.textContent = course.title || "Untitled course";

        courseSelect.appendChild(option);
      });

      if (courses.length === 0) {
        courseSelect.innerHTML =
          '<option value="">No courses available</option>';

        setStatus("No courses were found in the courses table.");
        return;
      }

      submitButton.disabled = false;
      setStatus("Courses loaded successfully. Select a course to continue.");
    }

    // Display the selected course
    courseSelect.addEventListener("change", () => {
      const selectedCourse = courses.find((course, index) => {
        return String(course.id ?? index) === courseSelect.value;
      });

      if (!selectedCourse) {
        courseInfo.classList.add("hidden");
        return;
      }

      courseTitle.textContent = selectedCourse.title || "Untitled course";
      courseType.textContent = selectedCourse.type || "Course";
      courseDescription.textContent =
        selectedCourse.description || "No description available.";

      courseInfo.classList.remove("hidden");
    });

    // Registration demo: this does not yet write to a database.
    paymentForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const selectedCourse = courses.find((course, index) => {
        return String(course.id ?? index) === courseSelect.value;
      });

      if (!selectedCourse) {
        setStatus("Please select a valid course.");
        return;
      }

      const registration = {
        name: document.getElementById("studentName").value.trim(),
        email: document.getElementById("studentEmail").value.trim(),
        course: selectedCourse.title,
        paymentReference:
          document.getElementById("paymentReference").value.trim()
      };

      console.log("Registration details:", registration);

      setStatus(
        "Form validated. To save registrations, create a registrations table in Supabase and connect this form to it."
      );
    });

    fetchCoursesFromDatabase();
  </script>
</body>
</html>

</html>
