<html>
    <style>
        body { background-color: #0B111E; color: #E2E8F0; scroll-behavior: smooth; }
        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>

<style id="knowledge-search-styles">
.kb-search-wrapper {
    max-width: 680px;
    margin: 0 auto 55px;
    position: relative;
    z-index: 20;
}

.kb-search-box {
    position: relative;
    display: flex;
    align-items: center;
    height: 48px;
    background: rgba(18, 26, 46, 0.88);
    border: 1px solid rgba(71, 85, 105, 0.7);
    border-radius: 999px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(14px);
    transition: all 0.3s ease;
}

.kb-search-box:focus-within {
    border-color: rgba(0, 240, 255, 0.7);
    box-shadow:
        0 0 0 3px rgba(0, 240, 255, 0.07),
        0 12px 45px rgba(0, 240, 255, 0.08);
    transform: translateY(-1px);
}

.kb-search-icon {
    color: #00F0FF;
    font-size: 22px;
    margin-left: 18px;
    margin-right: 10px;
    line-height: 1;
}

#kb-search {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #E2E8F0;
    font-size: 13px;
    padding-right: 45px;
}

#kb-search::placeholder {
    color: #64748B;
}

#kb-search-clear {
    position: absolute;
    right: 17px;
    color: #64748B;
    font-size: 19px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
}

#kb-search-clear.active {
    opacity: 1;
    pointer-events: auto;
}

#kb-search-clear:hover {
    color: #FF4A5A;
}

.kb-search-results {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    max-height: 390px;
    overflow-y: auto;
    background: rgba(11, 17, 30, 0.97);
    border: 1px solid rgba(51, 65, 85, 0.9);
    border-radius: 18px;
    padding: 8px;
    backdrop-filter: blur(18px);
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(0, 240, 255, 0.04);
}

.kb-search-results::-webkit-scrollbar {
    width: 5px;
}

.kb-search-results::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 999px;
}

.kb-result-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 14px 16px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    transition: all 0.25s ease;
    animation: kbResultIn 0.25s ease both;
}

.kb-result-card:hover {
    background: rgba(18, 26, 46, 0.9);
    border-color: rgba(0, 240, 255, 0.22);
    transform: translateX(3px);
}

.kb-result-info {
    min-width: 0;
}

.kb-result-title {
    color: #F8FAFC;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.kb-result-category {
    margin-top: 4px;
    color: #64748B;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

.kb-result-arrow {
    flex-shrink: 0;
    color: #00F0FF;
    font-size: 12px;
    font-weight: 700;
}

.kb-no-results {
    padding: 28px 18px;
    text-align: center;
    color: #64748B;
    font-size: 12px;
}

.kb-no-results strong {
    display: block;
    color: #CBD5E1;
    margin-bottom: 5px;
}

@keyframes kbResultIn {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 640px) {
    .kb-search-wrapper {
        margin-bottom: 40px;
    }

    .kb-search-box {
        height: 46px;
    }

    .kb-search-results {
        max-height: 320px;
    }

    .kb-result-card {
        padding: 13px;
    }
}
</style>

</html>
